name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment (qa, uat, staging) — used for vars and profile/.env via ENV"
        required: true
        type: choice
        options:
          - qa
          - uat
          - staging
      browser:
        description: "Browser — all runs every configured Playwright project"
        required: true
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'qa' }}

    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Set environment variables
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ vars.ADMIN_PASSWORD }}
        run: |
          TARGET_ENV="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'qa' }}"
          TARGET_BROWSER="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.browser || 'all' }}"
          echo "ENV=${TARGET_ENV}" >> $GITHUB_ENV
          echo "TARGET_BROWSER=${TARGET_BROWSER}" >> $GITHUB_ENV
          echo "BASE_URL=${BASE_URL}" >> $GITHUB_ENV
          echo "ADMIN_USERNAME=${ADMIN_USERNAME}" >> $GITHUB_ENV
          echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}" >> $GITHUB_ENV
          echo "Execute ENV=${TARGET_ENV}, browser=${TARGET_BROWSER}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm run install:browsers

      - name: Run Playwright tests
        env:
          ENV: ${{ env.ENV }}
          BASE_URL: ${{ env.BASE_URL }}
          ADMIN_USERNAME: ${{ env.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: |
          echo "Running Playwright tests — ENV=${ENV}, browser=${TARGET_BROWSER}"
          case "${TARGET_BROWSER}" in
            all)
              pnpm run test:playwright
              ;;
            chromium|firefox|webkit)
              pnpm exec playwright test --project="${TARGET_BROWSER}"
              ;;
            *)
              echo "Unknown browser: ${TARGET_BROWSER}"
              exit 1
              ;;
          esac

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
